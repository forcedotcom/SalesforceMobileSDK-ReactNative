on:
  workflow_call:
    inputs:
      ios:
        default: "^18"
        required: false
        type: string
      xcode:
        default: "^16"
        required: false
        type: string
      macos:
        default: macos-latest
        required: false
        type: string
      is_pr:
        type: boolean
        default: false
    secrets:
      TEST_CREDENTIALS:
        required: true
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-ios:
    runs-on: ${{ inputs.macos }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ ! inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: |
          if [[ "$XCODE_VERSION" == "^26" ]]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          else
            XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install Dependencies
        env:
          TEST_CREDENTIALS: ${{ secrets.TEST_CREDENTIALS }}
        run: |
          brew install gnu-sed
          npm install -g typescript
          cd iosTests
          ./create_test_credentials_from_env.js
          ./prepareios.js
      # Use mxcl to select Xcode only — mxcl does not support -retry-tests-on-failure
      - uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5  # v3.6.0
        with:
          xcode: ${{ inputs.xcode }}
          platform: iOS
          platform-version: ${{ inputs.ios }}
          action: none
      - name: Resolve simulator destination
        id: resolve_destination
        env:
          IOS: ${{ inputs.ios }}
        run: |
          IOS_MAJOR=$(echo "$IOS" | sed 's/^\^//' | cut -d. -f1)
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          major = sys.argv[1]
          d = json.load(sys.stdin)
          prefix = "iOS-" + major + "-"
          matching = {k: v for k, v in d.get("devices", {}).items() if prefix in k}
          for runtime_key in sorted(matching.keys(), reverse=True):
            for dev in matching[runtime_key]:
              if dev.get("isAvailable", True) and "iPhone" in dev.get("name", ""):
                print(dev["udid"])
                sys.exit(0)
          sys.exit(1)
          ' "$IOS_MAJOR")
          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available iPhone simulator found for iOS ${IOS_MAJOR}"
            exit 1
          fi
          printf 'destination=platform=iOS Simulator,id=%s\n' "$SIM_UDID" >> "$GITHUB_OUTPUT"
      - name: Run Tests
        id: xcodebuild
        env:
          DESTINATION: ${{ steps.resolve_destination.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace iosTests/ios/SalesforceReactTestApp.xcworkspace \
            -scheme SalesforceReactTestApp \
            -destination "$DESTINATION" \
            -resultBundlePath test.xcresult \
            -enableCodeCoverage YES \
            -retry-tests-on-failure \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            | xcbeautify
      - name: Archive xcodebuild logs on build failure
        if: failure() && steps.xcodebuild.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: xcodebuild-logs-rn-ios${{ inputs.ios }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify xcresult bundle exists
        if: success() || failure()
        run: |
          if [ ! -d "test.xcresult" ]; then
            echo "::error::test.xcresult bundle was not created — no tests ran"
            exit 1
          fi
      - name: Parse test results
        if: success() || failure()
        env:
          IOS: ${{ inputs.ios }}
        run: |
          brew install xcresultparser
          xcresultparser -o junit test.xcresult > "test-results-ios${IOS}.xml"
      - name: Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        if: success() || failure()
        with:
          check_name: iOS ${{ inputs.ios }} Test Results
          job_name: iOS ${{ inputs.ios }} Test Results
          require_tests: true
          include_empty_in_summary: false
          simplified_summary: true
          detailed_summary: true
          comment: true
          job_summary: true
          report_paths: 'test-results-ios${{ inputs.ios }}.xml'
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: success() || failure()
      - name: Upload test results artifact
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-ios${{ inputs.ios }}
          path: test-results-ios${{ inputs.ios }}.xml
