buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 31
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.3.20"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.1.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("org.jetbrains.dokka:dokka-gradle-plugin:2.0.0")
        classpath("org.jacoco:org.jacoco.core:0.8.14")
        classpath("io.github.gradle-nexus:publish-plugin:2.0.0")
    }
    // RNGP 0.87 depends on AGP 9.2.1; keep the MSDK 14.x toolchain at 9.1.1.
    configurations.classpath {
        resolutionStrategy.force("com.android.tools.build:gradle:9.1.1")
    }
}

// Note: com.facebook.react.rootproject not applied - not needed for test app
